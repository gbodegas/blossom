[project]
name = "blossom"
version = "0.1.0"
description = "Academic planning assistant scaffold for a family"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.64.0",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pydantic==2.11.7",
    # Pinned directly, though it arrives through fastapi. CVE-2026-54283 and
    # four others are starlette bugs, and fastapi only requires
    # starlette>=0.46.0, a floor that still permits every affected release.
    # Naming it here means a resolver cannot quietly pick a vulnerable one.
    "starlette==1.6.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    # httpx2 backs starlette's TestClient from starlette 1.0 onward; using the
    # original httpx with it is deprecated and, more practically, leaves the
    # whole TestClient surface untyped so mypy sees Any. httpx itself is still
    # installed as a transitive dependency of anthropic, but nothing in the
    # tests relies on it any more.
    "httpx2==2.10.0",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blossom"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true
