[project]
name = "blossom"
version = "0.1.0"
description = "Academic planning assistant for a family"
readme = "README.md"
# The upper bound exists because pydantic 2.11.7 depends on pydantic-core
# 2.33.2, which ships no 3.14 wheels. Revisit when pydantic is bumped.
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned together. langchain-anthropic 1.6.1 caps anthropic below 1.0, so
    # anthropic stays on 0.125.0, the last 0.x release; 1.7.0 lifts the cap and
    # is the moment to move both. langgraph-checkpoint-sqlite is the checkpoint
    # backend for the graph once it exists.
    "anthropic==0.125.0",
    "langchain==1.3.18",
    "langchain-anthropic==1.6.1",
    "langchain-core==1.6.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pydantic==2.11.7",
    # Pinned directly, though it arrives through fastapi. CVE-2026-54283 and
    # four others are starlette bugs, and fastapi only requires
    # starlette>=0.46.0, a floor that still permits every affected release.
    # Naming it here means a resolver cannot quietly pick a vulnerable one.
    "starlette==1.6.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    # httpx2 backs starlette's TestClient from starlette 1.0 onward. Plain httpx
    # is deprecated there and leaves the TestClient surface untyped, so mypy sees
    # Any. httpx is still installed as a transitive dependency of anthropic; the
    # tests do not import it.
    "httpx2==2.10.0",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blossom"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true
