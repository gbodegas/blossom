[project]
name = "blossom"
version = "0.1.0"
description = "Academic planning assistant for a family"
readme = "README.md"
# The upper bound exists because pydantic 2.11.7 depends on pydantic-core
# 2.33.2, which ships no 3.14 wheels. Revisit when pydantic is bumped.
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned together. langchain-anthropic 1.6.1 caps anthropic below 1.0, so
    # anthropic stays on 0.125.0, the last 0.x release; 1.7.0 lifts the cap and
    # is the moment to move both. langgraph-checkpoint-sqlite is the checkpoint
    # backend for the graph once it exists.
    "anthropic==0.125.0",
    "langchain==1.3.18",
    "langchain-anthropic==1.6.1",
    "langchain-core==1.6.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    # The checkpoint saver's driver. It arrives through the saver anyway, and
    # is named here because blossom/stores/checkpoints.py opens the connection
    # itself to set the busy timeout and secure_delete.
    "aiosqlite==0.22.1",
    "fastapi==0.141.1",
    # Parses the parent page's forms. Starlette refuses to read a form body
    # without it, for multipart and urlencoded alike.
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "pydantic==2.11.7",
    # Windows ships no time zone database, so ZoneInfo raises for every key
    # without this. The household zone is required configuration, so the
    # application would not start.
    "tzdata==2026.3",
    # Pinned directly, though it arrives through fastapi. CVE-2026-54283 and
    # four others are starlette bugs, and fastapi only requires
    # starlette>=0.46.0, a floor that still permits every affected release.
    # Naming it here means a resolver cannot quietly pick a vulnerable one.
    "starlette==1.6.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    # httpx2 backs starlette's TestClient from starlette 1.0 onward. Plain httpx
    # is deprecated there and leaves the TestClient surface untyped, so mypy sees
    # Any. httpx is still installed as a transitive dependency of anthropic; the
    # tests do not import it.
    "httpx2==2.10.0",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blossom"]

[tool.ruff]
target-version = "py312"
line-length = 100

# Ruff is the one linter and the one formatter. Its E and F rules are Flake8's,
# its S rules are Bandit's, and it covers the Pylint checks that matter here,
# so none of those runs over this code: a second tool on the same lines with
# its own defaults reports the same problem twice and disagrees about the rest.
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ANN",
    # Bandit's rules. Asserts are allowed in tests below; they are what a test
    # is made of.
    "S",
    # Naive datetimes. The time model exists to keep them out, and this catches
    # one at the call rather than at validation.
    "DTZ",
    # No print. The application speaks through routes and pages.
    "T20",
    # Ruff's own rules, including a noqa comment that suppresses nothing.
    "RUF",
    # The graph runs asynchronously.
    "ASYNC",
    "PIE",
    # Pytest style: a raises without a match, a compound assert, a yield with
    # nothing after it.
    "PT",
    "C4",
    # An exception message is assigned to a variable first, as this code does
    # throughout, so the traceback shows the raise and not the prose.
    "EM",
    "SIM",
]
ignore = [
    # A guard clause chain reads as a priority order; folding its tail into a
    # conditional expression hides that. Declined in .sourcery.yaml for the
    # same reason.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
# Stated rather than inherited. Black would agree at this project's line
# length and reflow everything at its own default, so the editor is pointed at
# ruff and Black is not run here. Line endings match .gitattributes, so the
# formatter never writes the convention git would undo at commit.
quote-style = "double"
line-ending = "lf"

# Read by Pylance in the editor. mypy is the type checker of record, pinned
# above and run in CI, and the mypy extension shows its diagnostics in the
# editor. A second checker with its own reading of pydantic and TypedDict
# would mark lines mypy accepts and pass lines it rejects, so Pylance keeps
# navigation, completion, and unresolved imports, and leaves type errors to
# mypy.
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "off"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []
