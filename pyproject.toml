[project]
name = "blossom"
version = "0.1.0"
description = "Academic planning assistant scaffold for a family"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==0.64.0",
    "fastapi==0.116.1",
    "jinja2==3.1.6",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    # httpx backs fastapi.testclient.TestClient. It currently arrives as a
    # transitive dependency of anthropic, so the suite passes without it being
    # declared; it is declared here so the tests do not depend on that accident.
    "httpx==0.28.1",
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["blossom"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = ["chromadb", "chromadb.*"]
ignore_missing_imports = true
