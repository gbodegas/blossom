# Actions are pinned to commits in .github/workflows/ci.yml, which keeps a
# moved tag from running code here. A pinned commit does not receive fixes on
# its own, so this watches for new releases and opens a pull request that moves
# the pin, with the version comment updated alongside it.
#
# Each of those pull requests is a fresh trust decision about code that will
# run with the repository checked out, so they are read and merged by hand.
# Nothing here turns on automatic merging, and nothing should.
#
# Python dependencies are left out on purpose. They are resolved through a
# proxy and rewritten by hand, so an automated pull request would produce a
# lockfile that does not install.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: Pin
