name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read only, so a step that runs here cannot change the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits rather than tags. A tag is a moving
      # reference, so whoever can move it can run code here. Pinning fixes
      # which code runs and nothing more: it does not vouch for that code, and
      # reverting a pin afterward stops the next run without undoing the last.
      #
      # What bounds the damage is the token above and the fact that this
      # repository holds no secrets, so a bad action can neither change
      # anything nor carry away anything that is not already public. It could
      # still make these checks report success, which is why a version bump is
      # read before it is merged rather than waved through.
      #
      # Adding a secret to this workflow would undo that reasoning, and is the
      # moment to revisit every line of this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the token out of .git/config, where every later step in the
          # job could otherwise read it. Nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Stated rather than inherited: this action's default turned caching
          # on at v5, so the behavior would otherwise arrive with a version
          # bump and go unmentioned. A restored cache is content from an
          # earlier run entering this one, which is worth naming.
          #
          # "auto" is the action's own policy. It caches on hosted runners
          # except for tag pushes and the pull_request_target, workflow_run
          # and release events, where an untrusted run could poison what a
          # later trusted one restores. This workflow triggers on none of
          # those, so auto and true behave the same here; auto is written
          # because it keeps deciding correctly if a trigger is ever added.
          enable-cache: auto
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy blossom tests
      - name: Pytest
        run: uv run pytest
