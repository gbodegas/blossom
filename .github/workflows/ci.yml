name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Every action is pinned to a commit, not a tag. A tag is a moving
      # reference: whoever can move it can run code in this workflow, with the
      # repository checked out and the token in the environment. The version
      # each commit belongs to is in the comment, and .github/dependabot.yml
      # opens a pull request when one moves.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy blossom tests
      - name: Pytest
        run: uv run pytest
