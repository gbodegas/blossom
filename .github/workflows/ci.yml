name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read only, so a step that runs here cannot change the repository.
permissions:
  contents: read

# A newer commit on a pull request ends the run of the commit it replaces, so
# the full suite is spent on the current head only. That holds for a run's
# first attempt. A run started again by hand has a group to itself, so it can
# neither end the current head's run nor be ended by it. A run on main is
# never ended or replaced either: each one has a group to itself, because runs
# that share a group can still replace one another while waiting, even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.run_attempt == 1 && format('pull-request-{0}', github.event.pull_request.number)) || format('run-{0}-attempt-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # A run that stops making progress is ended here rather than at GitHub's
    # own limit of six hours.
    timeout-minutes: 120
    steps:
      # Actions are pinned to commits rather than tags. A tag is a moving
      # reference, so whoever can move it can run code here. Pinning fixes
      # which code runs and nothing more: it does not vouch for that code, and
      # reverting a pin afterward stops the next run without undoing the last.
      #
      # What bounds the damage is the token above and the fact that this
      # repository holds no secrets, so a bad action can neither change
      # anything nor carry away anything that is not already public. It could
      # still make these checks report success, which is why a version bump is
      # read before it is merged rather than waved through.
      #
      # Adding a secret to this workflow would undo that reasoning, and is the
      # moment to revisit every line of this file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keeps the token out of .git/config, where every later step in the
          # job could otherwise read it. Nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Stated rather than inherited: this action's default turned caching
          # on at v5, so the behavior would otherwise arrive with a version
          # bump and go unmentioned. A restored cache is content from an
          # earlier run entering this one, which is worth naming.
          #
          # "auto" is the action's own policy. It caches on hosted runners
          # except for tag pushes and the pull_request_target, workflow_run
          # and release events, where an untrusted run could poison what a
          # later trusted one restores. This workflow triggers on none of
          # those, so auto and true behave the same here; auto is written
          # because it keeps deciding correctly if a trigger is ever added.
          enable-cache: auto
      - name: Install dependencies
        run: uv sync --dev
      # What the tests ran on, printed so a slow or odd run can be read
      # against the machine and the packages it had.
      - name: Runner and versions
        run: |
          nproc
          free -h
          uv run python --version
          uv pip list
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy blossom tests
      # Every test case's name, collected in one process before the workers
      # start. The step after the tests holds the results to this list, and
      # it is kept with them. On an error the listing is printed, since it
      # holds the error's text.
      - name: Collect test cases
        run: |
          mkdir -p test-results
          uv run pytest --collect-only -q > test-results/collected.txt \
            || { status=$?; cat test-results/collected.txt; exit "$status"; }
          tail -n 1 test-results/collected.txt
      # Four workers, one test file at a time on each: a file's cases stay
      # together, in order, in one process. A worker that dies is not started
      # again, so its loss fails the run instead of being worked around. The
      # options are given here and not in pyproject.toml, so a pytest that a
      # test starts on its own stays a single plain process.
      - name: Pytest
        run: >-
          uv run pytest -n 4 --dist loadfile --max-worker-restart=0
          --durations=50 --junitxml=test-results/junit.xml
      # pytest's own result is not enough here. A worker lost while the cases
      # are still being collected ends the run with nothing run and no error.
      # So the results file is read and held to the cases collected above:
      # each must be named in it exactly once, whatever its outcome. A skipped
      # case counts, so this shows that every case was reported, not that its
      # body ran. A results file that is missing or cannot be read fails too.
      - name: Every collected case is reported once
        run: >-
          uv run python .github/scripts/reported_cases.py
          test-results/collected.txt test-results/junit.xml
      # A record, not a check: every case's outcome and time, kept for two
      # weeks, one for each attempt when a run is started again. It runs after
      # a failure too and cannot turn one into a pass; a failed upload shows
      # on the run without changing its result.
      - name: Keep test results
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-attempt-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
