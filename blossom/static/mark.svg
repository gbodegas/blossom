<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
  <title>Blossom: a lotus resting on a stone in still water</title>
  <!-- Ripples, widest first, so each sits behind the next. -->
  <g fill="none" stroke="#c9dce9" stroke-width="2.2">
    <ellipse cx="100" cy="116" rx="82" ry="19"/>
    <ellipse cx="100" cy="116" rx="64" ry="14.5"/>
    <ellipse cx="100" cy="116" rx="47" ry="10"/>
  </g>
  <!-- The stone. -->
  <ellipse cx="100" cy="108" rx="40" ry="14" fill="#bfd7e8" stroke="#a6c4da" stroke-width="2"/>
  <ellipse cx="94" cy="103" rx="26" ry="6.5" fill="#d6e6f1"/>
  <!-- Petals. The side pair first; the center petal lies over them, a little
       translucent, so the overlaps read as a deeper pink the way they do in
       the logo. -->
  <g stroke="#e4a3b4" stroke-width="2" stroke-linejoin="round">
    <path d="M100 104 C 60 100, 38 70, 42 36 C 78 42, 98 70, 100 104 Z" fill="#f4c6d1" fill-opacity="0.92"/>
    <path d="M100 104 C 140 100, 162 70, 158 36 C 122 42, 102 70, 100 104 Z" fill="#f4c6d1" fill-opacity="0.92"/>
    <path d="M100 104 C 70 80, 72 44, 100 16 C 128 44, 130 80, 100 104 Z" fill="#f4c6d1" fill-opacity="0.82"/>
  </g>
</svg>
