{#
  What a press typed, given back in boxes to copy.
#}
{% macro typed_back(typed, typed_said) %}
  <div class="typed-back">
    <p class="note">{{ typed_said }}</p>
    {% for label, text in typed %}
      <label>{{ label }} <textarea rows="2" readonly>
{{ text }}</textarea></label>
    {% endfor %}
  </div>
{% endmacro %}
