<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Blossom{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/mark.svg">
    <link rel="stylesheet" href="/static/blossom.css">
    <script src="/static/blossom.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/student/due-this-week">
        <img class="mark" src="/static/mark.svg" alt="" width="44" height="33">
        <span class="wordmark">blossom</span>
      </a>
      <nav class="places" aria-label="Pages">
        <a href="/student/due-this-week"{% if page == "student" %} aria-current="page"{% endif %}>{% if page == "parent" %}Student week{% else %}My week{% endif %}</a>
        <a href="/parent"{% if page == "parent" %} aria-current="page"{% endif %}>Family review</a>
      </nav>
    </header>
    <main>
      {% if sample %}<p class="sample-label">Sample week</p>{% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="colophon">
      <p>Blossom does not contact the school or submit work for you.</p>
    </footer>
  </body>
</html>
